# We can consume this arg to check whether a build is in Konflux or not
KONFLUX=true
#

# The builder image is used to compile golang code
BUILDER_IMAGE=registry.redhat.io/openshift/golang-builder:golang-builder-v1.21-rhel9@sha256:d43252a51761cc4a795ad19df1b53f7823566be78039be338413e0b0b8f834fc
#

# The openshift cli image is used to fetch the oc binary
# Although this is the 4.14 release, we need a rhel9 binary and that is only available in 4.16+
OPENSHIFT_CLI_IMAGE=registry.redhat.io/openshift4/ose-cli-rhel9:v4.16@sha256:a746ed07c02f686c47248b3f3e6408067f47489a3578c9c592c4fd84a2a7da9e
#

# The opm image is used to serve the FBC
# There is a metadata processing bug preventing us from pinning this particular image for now
# OPM_IMAGE=registry.redhat.io/openshift4/ose-operator-registry:v4.14@sha256:5a2cc10046173b833a0552c2d63df981717847e8bc35dd0e322c26626d7f9738
#

# The runtime image is used to run the binaries
# This should match the dummy file Dockerfile.mintmaker in the lock-runtime directory
# Mintmaker should keep these in sync automatically when it performs updates
RUNTIME_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal:latest@sha256:1d7c5517a4a1a8e2688620b39ee980e82505ca1ab7ae5541b5463120ae9b3897
#

# The yq image is used at build time to manipulate yaml
YQ_IMAGE=quay.io/konflux-ci/yq:latest@sha256:9b73d39c362692d0bc5787c2b5e955cd54713e6bb97195a0fb2e87a6557040ee
#
